[project]
name = "perfume-inventory-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.2",
    "fastapi[standard]>=0.141.1",
    "sqlmodel>=0.0.42",
]

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# Tests import main/models/database, which live at the project root.
pythonpath = ["."]
testpaths = ["tests"]
