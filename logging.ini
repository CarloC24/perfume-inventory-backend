# Application logging, loaded at startup by src/main.py.
# Alembic keeps its own logging config in alembic.ini.

[loggers]
keys = root,uvicorn,sqlalchemy

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console

[logger_uvicorn]
level = INFO
handlers =
qualname = uvicorn

# INFO here would echo every statement the app runs.
[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-8s [%(name)s] %(message)s
datefmt = %Y-%m-%d %H:%M:%S
